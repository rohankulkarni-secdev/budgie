<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budgie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F2F4F3;
    --bg-deep: #A9927D;
    --ink: #0A0908;
    --ink-soft: #22333B;
    --sage: #22333B;
    --sage-soft: #A9927D;
    --rust: #22333B;
    --thread: rgba(34, 51, 59, 0.22);
    --pink: #5E503F;
    --powder: #A9927D;
    --aqua: #F2F4F3;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'DM Sans', -apple-system, sans-serif;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    overflow-x: hidden;
    position: relative;
    padding: 28px 20px 16px;
  }

  .brand{
    text-align: center;
    margin: 0 auto;
  }

  .brand h1{
    font-family: 'Space Grotesk', sans-serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: clamp(2.2rem, 5vw, 3rem);
    margin: 0;
    letter-spacing: 0.01em;
    color: var(--ink);
  }

  .brand p{
    font-size: 0.98rem;
    color: var(--ink-soft);
    margin: 6px 0 0;
    max-width: 34ch;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.5;
  }

  /* ---------- the wheel ---------- */

  .wheel-wrap{
    position: relative;
    width: min(340px, 70vw, calc(100cqh - 84px));
    height: min(340px, 70vw, calc(100cqh - 84px));
    aspect-ratio: 1;
    flex-shrink: 0;
    margin: 0 auto;
  }

  .home-navigation{
    width: 100%;
    min-height: 0;
    display: grid;
    place-items: center;
    container-type: size;
  }

  .thread{
    position: absolute;
    top: 50%;
    left: 50%;
    height: 1px;
    width: 38%;
    background-image: repeating-linear-gradient(
      to right, var(--thread) 0 6px, transparent 6px 11px
    );
    transform-origin: left center;
    opacity: 0;
  }
  .thread.n{ transform: rotate(-90deg) translateY(0); }
  .thread.e{ transform: rotate(0deg); }
  .thread.s{ transform: rotate(90deg); }
  .thread.w{ transform: rotate(180deg); }

  .hub{
    position: absolute;
    top: 50%;
    left: 50%;
    width: 42%;
    height: 42%;
    transform: translate(-50%, -50%) scale(0.85);
    border-radius: 50%;
    background: var(--bg-deep);
    border: 1px solid var(--thread);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10%;
    opacity: 0;
    animation: hub-breathe 6s ease-in-out infinite;
  }

  .hub-text{
    width: 100%;
    font-size: 0.92rem;
    line-height: 1.35;
    color: var(--ink-soft);
    transition: opacity 0.25s ease;
  }

  .hub-text .hub-title{
    display: block;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 1.05rem;
    color: var(--ink);
    margin-bottom: 4px;
  }

  .node{
    position: absolute;
    width: 96px;
    height: 96px;
    margin: -48px;
    border-radius: 50%;
    background: var(--bg);
    border: 1.5px solid var(--pink);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    text-decoration: none;
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 0.95rem;
    padding: 8px;
    opacity: 0;
    transform: scale(0.6);
    scale: 1;
    transition: scale 0.32s cubic-bezier(.2,.8,.3,1.2), border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
  }

  .node.top{    top: 0;   left: 50%; }
  .node.right{  top: 50%; left: 100%; }
  .node.bottom{ top: 100%;left: 50%; }
  .node.left{   top: 50%; left: 0; }

  .node:hover, .node:focus-visible{
    border-color: var(--ink);
    background: var(--bg-deep);
    scale: 1.14;
    z-index: 1;
    filter: brightness(1.18);
    box-shadow: 0 0 0 1px rgba(245, 245, 237, 0.2), 0 10px 32px rgba(0, 0, 0, 0.38);
    outline: none;
  }

  .node:focus-visible{
    box-shadow: 0 0 0 3px rgba(245, 245, 237, 0.4), 0 10px 32px rgba(0, 0, 0, 0.38);
  }

  /* ---------- entrance choreography ---------- */

  @media (prefers-reduced-motion: no-preference){
    .thread{ animation: thread-in 0.7s ease forwards; }
    .thread.n{ animation-delay: 0.15s; }
    .thread.e{ animation-delay: 0.3s; }
    .thread.s{ animation-delay: 0.45s; }
    .thread.w{ animation-delay: 0.6s; }

    .node{ animation: node-in 0.6s cubic-bezier(.2,.8,.3,1.1) forwards; }
    .node.top{ animation-delay: 0.35s; }
    .node.right{ animation-delay: 0.5s; }
    .node.bottom{ animation-delay: 0.65s; }
    .node.left{ animation-delay: 0.8s; }

    .hub{ animation: hub-in 0.6s ease forwards, hub-breathe 6s ease-in-out 1s infinite; }
  }

  @media (prefers-reduced-motion: reduce){
    .thread, .node, .hub{ opacity: 1; transform: none; animation: none; }
  }

  @keyframes thread-in{
    from{ opacity: 0; }
    to{ opacity: 1; }
  }

  @keyframes node-in{
    from{ opacity: 0; transform: scale(0.6); }
    to{ opacity: 1; transform: scale(1); }
  }

  @keyframes hub-in{
    from{ opacity: 0; transform: translate(-50%, -50%) scale(0.85); }
    to{ opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  @keyframes hub-breathe{
    0%, 100%{ transform: translate(-50%, -50%) scale(1); }
    50%{ transform: translate(-50%, -50%) scale(1.03); }
  }

  footer{
    color: var(--ink-soft);
    font-size: 0.8rem;
    text-align: center;
    margin: 0;
    padding-top: 12px;
    opacity: 0.8;
  }

  /* ---------- mobile: wheel becomes a stacked list ---------- */

  @media (max-width: 640px){
    body{
      min-height: 100vh;
      min-height: 100svh;
      padding: 56px 20px 16px;
    }
    .wheel-wrap{
      width: 100%;
      height: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin: 24px auto;
    }
    .thread{ display: none; }
    .hub{
      position: static;
      width: 100%;
      height: auto;
      transform: none !important;
      animation: none !important;
      opacity: 1;
      padding: 18px;
      margin-bottom: 4px;
    }
    .node{
      position: static;
      width: 100%;
      height: auto;
      margin: 0;
      border-radius: 16px;
      padding: 16px;
      opacity: 1;
      transform: none !important;
      animation: none !important;
    }
  }
</style>
<link rel="stylesheet" href="{{ url_for('static', filename='css/bloom-field.css') }}">
<script src="{{ url_for('static', filename='js/bloom-field.js') }}" defer></script>
</head>
<body>
  
  <a href="{{ url_for('profilePage') }}" style="position: absolute; top: 24px; left: 28px; color: var(--ink-soft);
          text-decoration: none; font-size: 0.85rem; border-bottom: 1px dashed var(--thread);">Profile</a>
  <a href="{{ url_for('logout') }}"
   style="position: absolute; top: 24px; right: 28px; color: var(--ink-soft);
          text-decoration: none; font-size: 0.85rem; border-bottom: 1px dashed var(--thread);">
  Log out
  </a>
  <div class="brand">
    <h1>budgie</h1>
    <p>Settle in. We'll help you find your footing — money, paperwork, and everything in between.</p>
  </div>

  <main class="home-navigation">
    <div class="wheel-wrap">
      <div class="thread n"></div>
      <div class="thread e"></div>
      <div class="thread s"></div>
      <div class="thread w"></div>

      <div class="hub">
        <div class="hub-text">
          <span class="hub-title">budgie</span>
        </div>
      </div>

      <a href="/insights" class="node top">Insights</a>
      <a href="/log" class="node right">Logs</a>
      <a href="/dashboard" class="node bottom" style="font-size:13px;">Dashboard</a>
      <a href="/help" class="node left">Help!</a>
    </div>
  </main>
</body>
</html>
