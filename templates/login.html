<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in · Budgie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F3ECDF;
    --bg-deep: #E7DCC4;
    --ink: #362F24;
    --ink-soft: #6B5F4C;
    --sage: #7C8A5C;
    --sage-soft: #97A375;
    --rust: #B5694A;
    --thread: #C9BFA6;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    position: relative;
  }

  body::before{
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(var(--ink) 0.5px, transparent 0.5px);
    background-size: 22px 22px;
    opacity: 0.035;
  }

  .card{
    width: 100%;
    max-width: 380px;
    background: var(--bg-deep);
    border: 1px solid var(--thread);
    border-radius: 22px;
    padding: 38px 34px;
    position: relative;
  }

  .brand{
    text-align: center;
    margin-bottom: 8px;
  }

  .brand h1{
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 1.9rem;
    margin: 0;
  }

  .brand p{
    color: var(--ink-soft);
    font-size: 0.9rem;
    margin: 6px 0 28px;
  }

  label{
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin-bottom: 16px;
  }

  input[type="email"], input[type="password"]{
    font-family: 'Work Sans', sans-serif;
    font-size: 0.95rem;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--thread);
    border-radius: 10px;
    padding: 10px 11px;
    outline: none;
    transition: border-color 0.2s ease;
  }

  input:focus{ border-color: var(--sage); }

  .error{
    background: rgba(181, 105, 74, 0.1);
    border: 1px solid var(--rust);
    color: var(--rust);
    font-size: 0.82rem;
    padding: 9px 12px;
    border-radius: 10px;
    margin-bottom: 16px;
  }

  button[type="submit"]{
    width: 100%;
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1rem;
    background: var(--sage);
    color: var(--bg);
    border: none;
    border-radius: 12px;
    padding: 13px;
    cursor: pointer;
    margin-top: 4px;
    transition: background 0.2s ease, transform 0.15s ease;
  }

  button[type="submit"]:hover{ background: #6d7a4f; }
  button[type="submit"]:active{ transform: scale(0.99); }

  .divider{
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 22px 0 18px;
    color: var(--ink-soft);
    font-size: 0.75rem;
  }

  .divider::before, .divider::after{
    content: "";
    flex: 1;
    height: 1px;
    background-image: repeating-linear-gradient(
      to right, var(--thread) 0 6px, transparent 6px 11px
    );
  }

  .footnote{
    text-align: center;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .footnote a{
    color: var(--sage);
    text-decoration: none;
    font-weight: 500;
    border-bottom: 1px dashed var(--sage-soft);
  }

  .footnote a:hover{ color: #6d7a4f; }
</style>
</head>
<body>
<div class="card">

  <div class="brand">
    <h1>budgie</h1>
    <p>Welcome back. Let's pick up where you left off.</p>
  </div>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="POST" action="{{ url_for('loginPage') }}">
    <label>Email
      <input type="email" name="email" required>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>

    <button type="submit">Log in</button>
  </form>

  <div class="divider">new here</div>

  <p class="footnote">Don't have an account yet? <a href="{{ url_for('signUp') }}">Sign up</a></p>

</div>
</body>
</html>
